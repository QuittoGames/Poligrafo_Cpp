; PlatformIO Project Configuration File
;
;   Build envs: docs at https://docs.platformio.org/page/projectconf/

[platformio]
default_envs = uno
src_dir = src

; ----------------------------------------------------------------------------
; @src//  -> firmware Arduino (sensor GSR)
;
; Não há dependências externas: o código usa apenas Arduino.h, math.h
; (stdlib) e headers locais em src/interfaces/. Mantemos lib_deps explícito
; para deixar o contrato claro.
; ----------------------------------------------------------------------------
[env:uno]
platform = atmelavr
board = uno
framework = arduino

monitor_speed = 9600
upload_speed = 115200

build_flags =
    -Wall
    -Wextra
    -std=gnu++11

lib_deps =
